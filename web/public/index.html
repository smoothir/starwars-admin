<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Admin — An 9 ABY</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="logo.jpg">
</head>
<body>

  <!-- ============ ECRAN DE CONNEXION ============ -->
  <div id="ecran-connexion" class="ecran-connexion">
    <div class="connexion-carte">
      <img class="connexion-logo" src="logo.jpg" alt="Logo">
      <h1 class="connexion-titre">RP<span>Admin</span></h1>
      <p class="connexion-sub">Accès restreint — Identifiez-vous</p>

      <form id="form-connexion" class="connexion-form" autocomplete="off">
        <div class="champ">
          <label for="c-user">Identifiant</label>
          <input type="text" id="c-user" name="username" autocomplete="username" required>
        </div>
        <div class="champ">
          <label for="c-pass">Mot de passe</label>
          <input type="password" id="c-pass" name="password" autocomplete="current-password" required>
        </div>
        <p id="connexion-erreur" class="connexion-erreur" hidden>Identifiants incorrects.</p>
        <button type="submit" class="btn-principal btn-connexion" id="btn-connexion">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- ============ APPLICATION ============ -->
  <div class="app-shell" id="app-shell" hidden>

    <!-- ============ NAVBAR ============ -->
    <header class="topbar">
      <div class="topbar-inner">
        <button class="topbar-side topbar-statut" id="btn-statut" title="Statut de connexion">
          <span class="status-dot" id="status-dot"></span>
          <span id="connexion-statut">Prêt</span>
        </button>

        <div class="topbar-brand">
          <img src="logo.jpg" alt="Logo" class="topbar-logo">
          <div class="topbar-brand-text">
            <h1>RP<span>ADMIN</span></h1>
            <p class="topbar-sub">An 9 après la Bataille de Yavin</p>
          </div>
        </div>

        <button class="topbar-side btn-deconnexion" id="btn-deconnexion" title="Se déconnecter">Déconnexion</button>
      </div>

      <nav class="topbar-nav">
        <button class="nav-btn" data-collection="profils" onclick="chargerDonnees('profils')">
          <span class="nav-label">Profils RP</span>
          <span class="nav-count" id="count-profils"></span>
        </button>
        <button class="nav-btn" data-collection="inventaire" onclick="chargerDonnees('inventaire')">
          <span class="nav-label">Inventaire</span>
          <span class="nav-count" id="count-inventaire"></span>
        </button>
      </nav>
    </header>

    <!-- ============ ZONE PRINCIPALE ============ -->
    <main class="main-area">
      <div class="ambient-glow"></div>

      <header class="main-header">
        <div class="header-titres">
          <h2 id="titre-section">Bienvenue</h2>
          <p id="sous-titre" class="sous-titre">Choisissez « Profils RP » dans le menu pour commencer.</p>
        </div>
        <div class="search-wrap" id="search-wrap" hidden>
          <span class="search-icon">🔍</span>
          <input id="recherche" type="text" placeholder="Rechercher un nom..." oninput="filtrerListe()" autocomplete="off">
        </div>
      </header>

      <div id="contenu" class="contenu">
        <div class="etat-vide">
          <div class="etat-vide-icone">🛰️</div>
          <p>En attente de sélection...</p>
          <span class="etat-vide-sub">Choisissez « Profils RP » dans le menu.</span>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ PANNEAU COULISSANT (édition + inventaire) ============ -->
  <div id="overlay" class="overlay" onclick="fermerPanneau()"></div>
  <aside id="panneau-edition" class="panneau-edition">
    <div class="panneau-header">
      <div>
        <span class="panneau-eyebrow" id="panneau-eyebrow">Édition</span>
        <h3 id="panneau-titre">—</h3>
      </div>
      <button class="btn-fermer" onclick="fermerPanneau()" aria-label="Fermer">✕</button>
    </div>
    <div id="panneau-corps" class="panneau-corps"></div>
  </aside>

  <!-- ============ PANNEAU CATALOGUE (s'ouvre à droite au clic) ============ -->
  <div id="overlay-catalogue" class="overlay-catalogue" onclick="fermerCataloguePanel()"></div>
  <aside id="panneau-catalogue" class="panneau-catalogue">
    <div class="panneau-header">
      <div>
        <span class="panneau-eyebrow">Inventaire</span>
        <h3 id="panneau-catalogue-titre">Catalogue d'objets</h3>
      </div>
      <button class="btn-fermer" onclick="fermerCataloguePanel()" aria-label="Fermer">✕</button>
    </div>
    <div id="panneau-catalogue-corps" class="panneau-corps"></div>
  </aside>

  <!-- Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
