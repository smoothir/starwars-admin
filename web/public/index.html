<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Admin — An 9 ABY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23090c14'/%3E%3Cpath d='M12 3 14.2 9.8 21 12 14.2 14.2 12 21 9.8 14.2 3 12 9.8 9.8Z' fill='%23ffd82a'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='%233fc5ff'/%3E%3C/svg%3E">
</head>
<body>

  <!-- Particules d'ambiance (poussière d'étoiles flottante, purement décoratif / CSS) -->
  <div id="particules" class="particules" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-sigil" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2 14.5 9.5 22 12 14.5 14.5 12 22 9.5 14.5 2 12 9.5 9.5Z" fill="var(--gold)"/>
            <circle cx="12" cy="12" r="2.4" fill="var(--blue)"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>RP<span>Admin</span></h1>
          <p class="brand-sub">An 9 après la Bataille de Yavin</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn" data-collection="profils" onclick="chargerDonnees('profils')">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Profils RP</span>
          <span class="nav-count" id="count-profils"></span>
        </button>
        <button class="nav-btn" data-collection="inventaire" onclick="chargerDonnees('inventaire')">
          <span class="nav-icon">🎒</span>
          <span class="nav-label">Inventaire</span>
          <span class="nav-count" id="count-inventaire"></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="statut-ligne">
          <span class="status-dot" id="status-dot"></span>
          <span id="connexion-statut">Prêt</span>
        </div>
      </div>
    </aside>

    <!-- ============ ZONE PRINCIPALE ============ -->
    <main class="main-area">
      <div class="ambient-glow"></div>

      <header class="main-header">
        <div class="header-titres">
          <h2 id="titre-section">Bienvenue</h2>
          <p id="sous-titre" class="sous-titre">Choisissez « Profils RP » dans le menu pour commencer.</p>
        </div>
        <div class="search-wrap" id="search-wrap" hidden>
          <span class="search-icon">🔍</span>
          <input id="recherche" type="text" placeholder="Rechercher un nom..." oninput="filtrerListe()" autocomplete="off">
        </div>
      </header>

      <div id="contenu" class="contenu">
        <div class="etat-vide">
          <div class="etat-vide-icone">🛰️</div>
          <p>En attente de sélection...</p>
          <span class="etat-vide-sub">Choisissez « Profils RP » dans le menu.</span>
        </div>
      </div>
    </main>
  </div>

  <!-- ============ PANNEAU D'ÉDITION COULISSANT ============ -->
  <div id="overlay" class="overlay" onclick="fermerPanneau()"></div>
  <aside id="panneau-edition" class="panneau-edition">
    <div class="panneau-header">
      <div>
        <span class="panneau-eyebrow" id="panneau-eyebrow">Édition</span>
        <h3 id="panneau-titre">—</h3>
      </div>
      <button class="btn-fermer" onclick="fermerPanneau()" aria-label="Fermer">✕</button>
    </div>
    <div id="panneau-corps" class="panneau-corps"></div>
  </aside>

  <!-- Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
